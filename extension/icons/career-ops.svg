    <rect x="42" y="76" width="44" height="7" rx="3"/>
    <rect x="42" y="92" width="28" height="7" rx="3"/>
  </g>

  <!-- the field being filled, with the caret still in it -->
  <rect x="42" y="56" width="34" height="7" rx="3" fill="#6366f1"/>
  <rect x="79" y="51" width="4" height="17" rx="2" fill="#6366f1"/>
