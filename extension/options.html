<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>career-ops autofill — options</title>
  <link rel="stylesheet" href="lib/veex.css" />
  <style>
    /* career-ops autofill — indigo. Layout only; the veextensions kit
       supplies colours, typography and components. */
    :root {
      --veex-accent:       #6366f1;
      --veex-accent-hover: #818cf8;
      --veex-accent-fg:    #ffffff;
    }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .co-wrap { flex: 1 1 auto; width: 100%; max-width: 560px; margin: 0 auto; padding: 20px 16px; }
    #status:empty { display: none; }
  </style>
</head>

<body class="veex">
  <header class="veex-header">
    <span class="veex-header__mark" aria-hidden="true"></span>
    <div>
      <h1 class="veex-header__title">career-ops autofill</h1>
      <p class="veex-header__sub">Fills and highlights — never submits.</p>
    </div>
  </header>

  <main class="co-wrap">
    <section class="veex-card">
      <h2 class="veex-card__title">Connection</h2>
      <label class="veex-field">
        <span class="veex-field__label">career-ops UI base URL (required)</span>
        <input id="apiBase" class="veex-input veex-input--mono" placeholder="https://your-career-ops-host" autocomplete="off" spellcheck="false" />
        <p class="veex-hint">
          Where your career-ops UI is reachable — a hostname behind your reverse
          proxy, or <code>http://SERVER-IP:3340</code> on your LAN or VPN.
          Stored only in this browser.
        </p>
      </label>
    </section>
  </main>

  <footer class="veex-footer">
    <button id="save" class="veex-btn veex-btn--primary">Save</button>
    <span class="veex-footer__spacer"></span>
    <span id="status" class="veex-status" data-shown="true" role="status" aria-live="polite"></span>
  </footer>

  <script src="options.js"></script>
</body>
</html>
