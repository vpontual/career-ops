<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>career-ops autofill — options</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 460px; margin: 24px auto; padding: 0 16px; color: #0f172a; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 8px 10px; font: 14px monospace; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 8px 14px; font-weight: 600; color: #fff; background: #4f46e5; border: none; border-radius: 6px; cursor: pointer; }
    .hint { color: #64748b; font-size: 12px; margin-top: 6px; }
    #status { margin-top: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <h2>career-ops autofill</h2>
  <label for="apiBase">career-ops UI base URL (required)</label>
  <input id="apiBase" placeholder="https://your-career-ops-host  (or  http://SERVER-IP:3340)" />
  <div class="hint">Enter the address where your career-ops UI is reachable, e.g. a hostname behind your reverse proxy or <code>http://SERVER-IP:3340</code> on your LAN/VPN. Stored only in your browser.</div>
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
