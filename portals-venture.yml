# portals-venture.yml
# Track E. VC platform, accelerator, studio and operator/entrepreneur-in-residence
# roles - the space between product, advising and founding.
#
# ONLY VERIFIED SLUGS BELONG HERE. Slug-guessing against Greenhouse/Ashby/Lever
# produced eight wrong-company collisions on 2026-07-29 alone: greenhouse/robinhood
# is Robinhood Markets not Robin Hood Foundation, ashby/human is HUMAN Security not
# Human Ventures, greenhouse/village is a New Jersey childcare centre, ashby/grand is
# a Dublin fintech, greenhouse/thrive is an Atlanta design studio, ashby/compound is a
# wealth advisor, greenhouse/wing is Alphabet's drone unit, greenhouse/amplify is
# Amplify Education. Open the board and read the job titles before adding a line.
#
# Founders Factory posts mostly Berlin/London - kept because the studio model fits,
# but expect geo rejects.

title_filter:
  positive:
  - Platform
  - Head of Platform
  - Director of Platform
  - Talent Partner
  - Head of Talent
  - Community
  - Program Director
  - Director of Programs
  - Program Manager
  - Venture Partner
  - Operator in Residence
  - Operator-In-Residence
  - Entrepreneur in Residence
  - Operating Partner
  - Portfolio
  - Managing Director
  negative:
  - Analyst
  - Intern
  - Associate
  - Executive Assistant
  - Accountant
  - Controller
  - Engineer
  - Designer
  - Recruiter Coordinator
  - Fund Accountant
  - Compliance
  - Legal
  - Tax
  - Audit
tracked_companies:
- name: Bessemer Venture Partners
  careers_url: https://job-boards.greenhouse.io/bessemerventurepartners
  api: https://boards-api.greenhouse.io/v1/boards/bessemerventurepartners/jobs
  enabled: true
- name: Company Ventures
  careers_url: https://jobs.ashbyhq.com/companyventures
  enabled: true
- name: First Round Capital
  careers_url: https://jobs.ashbyhq.com/firstround
  enabled: true
- name: Forum Ventures (Studio)
  careers_url: https://jobs.ashbyhq.com/forum-ventures
  enabled: true
- name: Founders Factory
  careers_url: https://jobs.ashbyhq.com/founders-factory
  enabled: true
- name: General Catalyst
  careers_url: https://job-boards.greenhouse.io/generalcatalyst
  api: https://boards-api.greenhouse.io/v1/boards/generalcatalyst/jobs
  enabled: true
- name: Primary Venture Partners
  careers_url: https://jobs.ashbyhq.com/primary
  enabled: true
- name: Y Combinator
  careers_url: https://jobs.ashbyhq.com/ycombinator
  enabled: true
scan_settings:
  max_results_per_company: 20
  max_age_days: 60
  default_scan_method: greenhouse_api
