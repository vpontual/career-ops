# portals-now.yml - Track D, "Get Hired Now".
#
# The point of this track is a good path to INCOME, not a good fit for the NYC
# search. VP set it deliberately loose (2026-08-04): no NYC requirement, no $150K
# floor, no archetype. Another country, another currency, contract or full-time,
# all fine. He is fluent in English, Portuguese, Spanish and French, and that is
# a real market with far less competition than the NYC PM pool.
#
# There is therefore NO location_filter here on purpose. Do not add one.
#
# Every board below was probed on 2026-08-04 and returned live product roles.
# Slugs that answered but carried nothing were discarded rather than trusted.

# ⚠ This is deliberately WIDE. The test on this track is "could he do it and would
# it pay soon", not "does the title say Product Manager". An allowlist of product
# titles was the first version and it was wrong: it blocked every other kind of
# work VP could do and turned this tab into the NYC search with a different
# passport. Experience that earns MORE is a bonus applied in scoring, never a
# filter applied here.
title_filter:
  positive:
  # Speed signals - these start in weeks, not quarters
  - Fractional
  - Interim
  - Contract
  - Freelance
  - Temporary
  - Consultant
  - Consulting
  - Advisor
  - Advisory
  # Anything he could credibly do, product or not
  - Product
  - Program
  - Project
  - Portfolio
  - Delivery
  - Operations
  - Strategy
  - Strategic
  - Business
  - Commercial
  - Partnerships
  - Alliances
  - Customer Success
  - Solutions
  - Implementation
  - Onboarding
  - Analyst
  - Research
  - Insights
  - Competitive
  - Instructor
  - Trainer
  - Training
  - Curriculum
  - Enablement
  - Documentation
  - Technical Writer
  - Localization
  - Localisation
  - Internationalization
  - Market Entry
  - Expansion
  - Innovation
  - Transformation
  - Chief of Staff
  - General Manager
  - Head of
  - Director
  - Lead
  - Manager
  - Principal
  negative:
  - Tax
  - Audit
  - Payroll
  - Controller
  - Treasury
  - Accounting
  - Accountant
  - FP&A
  - Compensation
  - Benefits
  - Recruiter
  - Recruiting
  - Talent Acquisition
  - People Analytics
  - HRBP
  - Counsel
  - Legal
  - Paralegal
  - Compliance Officer
  - Information Security
  - Security Engineer
  - SOC Analyst
  - GRC
  - Creative
  - Brand Campaigns
  - Art Direction
  - Copywriter
  - Designer
  - Clinical
  - Nurse
  - Physician
  - Actuary
  - Underwriting
  - Quantitative
  - Sales Leader
  - Account Executive
  - Account Manager
  - Sales Manager
  - Field Marketing
  - Performance Marketing
  - Demand Generation
  - SEO
  # -- original exclusions below --
  # Hours-for-minimum-wage work, excluded by VP by name.
  - Driver
  - Courier
  - Delivery Driver
  - Warehouse
  - Cashier
  - Retail Associate
  - Call Center
  - Call Centre
  - Customer Service Representative
  - Janitor
  - Security Guard
  # He is not a software developer, and cannot pass a coding screen.
  - Software Engineer
  - Engineer,
  - Engineering Manager
  - Backend
  - Front End
  - Frontend
  - Full Stack
  - Fullstack
  - Data Engineer
  - Data Scientist
  - Machine Learning Engineer
  - DevOps
  - Site Reliability
  - QA Engineer
  - Developer
  # Tool-administration specialisms
  - Atlassian
  - Salesforce
  - ServiceNow
  - Workday
  - NetSuite
  - SAP
  # Not a real start
  - Intern
  - Internship
  - Apprentice
  - Graduate Programme

