# portals-nonprofit.yml - Track B. "Bring product skills somewhere with community impact."
#
# Comp floor is ~$60K, not Track A's $150K. VP said explicitly not to apply the
# PM rubric's floor here (2026-07-29). Do not add one.
#
# ── Why this file was rewritten on 2026-08-11 ──────────────────────────────
# Track B was wired end to end - scan.mjs sweeps it nightly, lib/track.mjs routes
# on its board slugs, rank-leads and recompute score it - and still produced 2
# roles at tier 4 against Track A's 434 and Track E's 53, with ZERO cards in the
# review queue. The cause was not the rubric and not detection. It was SOURCING:
# this file listed 13 boards against portals.yml's 158, and a live sweep of all
# 13 returned 189 postings of which 180 died on the title filter and the
# remaining 6 were already known. The track could not produce a role because
# there were almost no roles to produce.
#
# Two things changed:
#   1. 24 more boards, every one PROBED LIVE on 2026-08-11 and confirmed to be
#      the organisation it claims to be by reading its actual postings.
#   2. A title filter that admits the titles nonprofits actually use. The old
#      positive list was 16 exact PM-shaped phrases, so iMentor's "NYC Program
#      Manager", Wikimedia's "Lead Program Manager" and Code for America's
#      "Emerging Technology & AI Governance & Enablement Lead" were all dropped
#      before they were ever fetched.
#
# ⚠ A SLUG THAT ANSWERS 200 IS NOT THE ORGANISATION YOU MEANT. Six candidates
# were rejected on 2026-08-11 for exactly this, after reading their postings:
#   robinhood      -> Robinhood Markets, the brokerage. 136 postings, "Crypto AML
#                     Program Manager", "Senior Underwriting Associate". Adding it
#                     would have routed a fintech to the nonprofit rubric and let
#                     it bypass Track A's $150K floor - the identical bug the
#                     header of lib/track.mjs records for Northern Trust.
#   sesame         -> Sesame AI, an SF voice-hardware startup ("Eyewear Designer").
#   sesamestreet   -> Greenhouse's DEMO board. Its postings are "Lawn mower 1 @
#                     Sesame Street" and "Your Dream Job @ Anywhere".
#   psi            -> an AI lab in Boston ("Member of Technical Staff, Physics
#                     Research"), not Population Services International.
#   candid         -> Candid the dental-aligner company, not Candid/GuideStar.
#   air            -> a defense contractor ("Vice President of Defense Sales",
#                     "Implementation Engineer - Strategic Munitions"), not the
#                     American Institutes for Research.
#   brookings      -> an unrelated SF company, not the Brookings Institution.
# Read the postings before trusting a slug. Same rule the venture config learned
# after eight wrong-company collisions and the smartrecruiters parser records for
# KIPP.

# ── Title filter ───────────────────────────────────────────────────────────
# This is a CHEAP PREFILTER, not the policy. The authoritative gate is
# titlePassesForTrack('nonprofit', ...) in lib/track.mjs, which requires a topic
# word AND a seniority word and runs before the ~34s scoring call. So this list
# can afford to be topic-led and let that AND do the narrowing; what it must NOT
# do is what the old one did, which is drop real roles before a JD ever exists.
title_filter:
  positive:
  # Topic words. Seniority is applied downstream, in code.
  - Product
  - Program
  - Technology
  - Technical
  - Innovation
  - Digital
  - Data
  - Impact
  - Operations
  - Strategy
  - Strategic
  - Platform
  - Chief of Staff
  - Transformation
  - Service Design
  - Initiative
  negative:
  # FUNDRAISING. VP's brief is product skills for community impact, not development.
  - Fundraising
  - Development Officer
  - Development Associate
  - Major Gifts
  - Midlevel Gifts
  - Individual Giving
  - Planned Giving
  - Grant Writer
  - Grants Manager
  - Grants Officer
  - Donor
  - Philanthropy
  - Corporate Partnerships
  - Foundation Partnerships
  - Membership Development
  # NOT A JOB HE WOULD TAKE, or not a job at all.
  - Volunteer
  - Intern
  - Internship
  - Fellowship
  - Fellow
  - Ambassador
  - Talent Community
  - Resume Drop
  - General Application
  - Expression of Interest
  - Don't see what
  - No current openings
  # ENGINEERING and the visual crafts. He is not a software developer and cannot
  # pass a coding screen; "Product Designer" is not a product-management role.
  - Engineer
  - Engineering
  - Developer
  - Programmer
  - Architect
  - Designer
  - Design Lead
  - Data Scientist
  - Data Science
  - Data Engineer
  - Data Analyst
  - DevOps
  - SRE
  - Machine Learning
  # DEMAND-GEN marketing and sales. Excluded by name on every other track.
  - Growth Marketing
  - Growth Marketer
  - Demand Generation
  - Lead Generation
  - Performance Marketing
  - Content Marketing
  - Social Media
  - Sales
  - Account Executive
  - Account Manager
  - Business Development Representative
  # SPECIALISMS he has never practised.
  - Counsel
  - Paralegal
  - Attorney
  - Legal
  - Compliance
  - Accountant
  - Accounting
  - Payroll
  - Controller
  - Treasury
  - Actuar
  - Underwriting
  - Recruiter
  - Recruiting
  - Talent Acquisition
  - Finance
  - Financial
  - Loan Origination
  - Communications
  - Media Relations
  - Public Relations
  - Clinician
  - Nurse
  - Physician
  - Chemist
  - Technician
  - Custodian
  # TOO JUNIOR. titlePassesForTrack also requires a seniority word, but excluding
  # here saves the JD fetch entirely.
  - Assistant
  - Coordinator
  - Organizer
  - Apprentice

# ── Location filter ────────────────────────────────────────────────────────
# VP is in Manhattan and will not relocate; lib/track.mjs gates
# 'onsite-elsewhere'/'hybrid-elsewhere' to 1 on every track. Without this filter
# that gate fires only AFTER a JD fetch and a scoring call. The international
# nonprofits are the whole reason it is needed: Khan Academy's board is ~25 India
# roles, One Acre Fund's is ~39 across Rwanda/Kenya/Nigeria/Burundi/Malawi, and
# Acumen's is Pakistan/Nairobi/Lagos/London/Mumbai. All correctly worthless here,
# all free to drop at this point and expensive to drop later.
#
# ⚠ Do NOT put a bare "ny" in the positive list. "Kenya" contains it. Negatives
# are evaluated first so Kenya would still be dropped, but "Sunnyvale" would not.
# An unstated location is KEPT - remote roles often leave the field blank.
location_filter:
  positive:
  - remote
  - united states
  - u.s.
  - usa
  - new york
  - brooklyn
  - queens
  - bronx
  - manhattan
  - long island city
  - yonkers
  - newark
  - jersey city
  - ', ny'
  - 'ny,'
  - nyc
  - flexible
  - telecommuter
  - anywhere
  - national
  - multiple locations
  - distributed
  negative:
  - kenya
  - nairobi
  - nigeria
  - lagos
  - abuja
  - uganda
  - kampala
  - rwanda
  - kigali
  - burundi
  - malawi
  - zambia
